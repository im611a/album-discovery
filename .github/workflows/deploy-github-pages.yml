name: Deploy GitHub Pages

on:
  push:
    branches:
      - feat/content-pipeline-bulk-operator-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /album-discovery
          NEXT_PUBLIC_SITE_URL: https://im611a.github.io/album-discovery
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build -- --webpack
      - name: Verify static project-site output
        env:
          NEXT_PUBLIC_BASE_PATH: /album-discovery
          NEXT_PUBLIC_SITE_URL: https://im611a.github.io/album-discovery
        run: |
          pnpm test:static-links
          node scripts/verify-github-pages-export.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
